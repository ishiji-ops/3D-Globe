<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 地球儀 (多機能・安定版)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; cursor: grab; }
        canvas:active { cursor: grabbing; }

        /* 読み込み中のメッセージ */
        #loading-msg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff; font-size: 20px; font-weight: bold;
            z-index: 100; pointer-events: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px; border-radius: 8px;
        }

        /* 測定結果・情報表示用のUIパネル */
        #ui-panel {
            position: absolute;
            top: 15px; left: 15px;
            background: rgba(0, 20, 40, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #00ffff;
            pointer-events: auto; /* UIのクリックを有効にする */
            z-index: 10;
            width: 260px;
        }
        .mode-select {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #555;
            font-size: 14px;
        }
        .mode-select label { display: block; margin-bottom: 5px; cursor: pointer; }
        .info-row { margin-bottom: 8px; font-size: 14px; }
        .val { color: #00ffff; font-weight: bold; }
        #distance-result { 
            margin-top: 15px; font-size: 18px; font-weight: bold; color: #ff00ff; 
            border-top: 1px solid #555; padding-top: 10px;
        }
        #reset-btn {
            margin-top: 10px; width: 100%; padding: 6px;
            background-color: #444; color: white; border: 1px solid #666; border-radius: 4px; cursor: pointer;
        }
        #reset-btn:hover { background-color: #666; }
        
        /* 各モード用のコンテナ */
        #measure-container, #globe-container { display: none; }
        #measure-container.active, #globe-container.active { display: block; }
    </style>
</head>
<body>
    <!-- ローディング表示 -->
    <div id="loading-msg">地図データを読み込み中...</div>

    <!-- UIパネル -->
    <div id="ui-panel">
        <div class="mode-select">
            <label><input type="radio" name="mode" value="simple" checked> 簡易計測モード (10°単位)</label>
            <label><input type="radio" name="mode" value="precise"> 精密計測モード (1°単位)</label>
            <label><input type="radio" name="mode" value="globe"> 地球儀モード (国・首都情報)</label>
        </div>

        <div id="search-section" style="margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #555;">
            <div style="font-size: 12px; color: #aaa; margin-bottom: 6px;">国名・首都名・海洋名で検索</div>
            <div style="display: flex; gap: 6px;">
                <input id="search-input" type="text" placeholder="例: 日本 / Tokyo / 太平洋" style="flex: 1; min-width: 0; padding: 6px; border-radius: 4px; border: 1px solid #666; background: #222; color: #fff;">
                <button id="search-btn" style="padding: 6px 10px; background-color: #007acc; color: white; border: 1px solid #666; border-radius: 4px; cursor: pointer;">検索</button>
            </div>
            <div id="search-status" style="font-size: 12px; color: #ff8888; margin-top: 6px;"></div>
        </div>

        <div id="measure-container" class="active">
            <div style="font-size: 12px; color: #aaa; margin-bottom: 10px;" id="measure-hint">地球上の緯度経度交点をクリック</div>
            <div class="info-row" id="point1-info">地点1: <span class="val">未選択</span></div>
            <div class="info-row" id="point2-info">地点2: <span class="val">未選択</span></div>
            <div id="distance-result">距離: --- km</div>
            <button id="reset-btn" onclick="resetMeasurement()">リセット</button>
        </div>

        <div id="globe-container">
            <div style="font-size: 12px; color: #aaa; margin-bottom: 10px;">陸地をクリックして情報を表示</div>
            <button id="lang-toggle-btn" style="margin-bottom: 10px; width: 100%; padding: 6px; background-color: #444; color: white; border: 1px solid #666; border-radius: 4px; cursor: pointer;">表示言語: 日本語 (押すとEnglish)</button>
            <div class="info-row"><span id="country-label">国名</span>: <br><span id="country-name" class="val" style="font-size: 18px;">---</span></div>
            <div class="info-row" id="capital-row"><span id="capital-label">首都</span>: <br><span id="capital-name" class="val" style="font-size: 16px; color: #ffaa00;">---</span></div>
        </div>
    </div>

    <!-- three.js 本体のみを読み込む（OrbitControls への外部依存を撤廃） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. 基本設定
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const radius = 1;
        const earthGroup = new THREE.Group();
        scene.add(earthGroup);

        // 地球本体 (地図読み込み前でも青い球体が見えるように少し明るく設定)
        const earthGeometry = new THREE.SphereGeometry(radius, 64, 64);
        const earthMaterial = new THREE.MeshBasicMaterial({ color: 0x003366 }); 
        const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
        earthGroup.add(earthMesh);

        // 2. カメラ操作（OrbitControlsを使わず自前で球面軌道カメラを実装）
        //    ※ earthGroup 自体は回転させない。緯度経度・国判定のロジックは
        //      「地球のローカル座標＝ワールド座標」を前提にしているため、
        //      回転させるのはカメラの方にする。
        let cameraTheta = 0;            // 水平角
        let cameraPhi = Math.PI / 2.3;  // 垂直角（0=真上, PI=真下）
        let cameraRadius = 3.5;

        function updateCameraPosition() {
            camera.position.x = cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta);
            camera.position.y = cameraRadius * Math.cos(cameraPhi);
            camera.position.z = cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta);
            camera.lookAt(0, 0, 0);
        }
        updateCameraPosition();

        let isDragging = false;
        let dragged = false;
        let lastMouse = { x: 0, y: 0 };
        let downMouse = { x: 0, y: 0 };

        function onDragStart(x, y) {
            isDragging = true;
            dragged = false;
            lastMouse = { x, y };
            downMouse = { x, y };
        }
        function onDragMove(x, y) {
            if (!isDragging) return;
            const deltaX = x - lastMouse.x;
            const deltaY = y - lastMouse.y;
            if (Math.abs(x - downMouse.x) > 3 || Math.abs(y - downMouse.y) > 3) dragged = true;

            cameraTheta -= deltaX * 0.005;
            cameraPhi -= deltaY * 0.005;
            cameraPhi = Math.max(0.1, Math.min(Math.PI - 0.1, cameraPhi));

            updateCameraPosition();
            lastMouse = { x, y };
        }
        function onDragEnd() { isDragging = false; }

        renderer.domElement.addEventListener('mousedown', (e) => onDragStart(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => onDragMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', onDragEnd);

        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) onDragStart(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) onDragMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchend', onDragEnd);

        renderer.domElement.addEventListener('wheel', (e) => {
            e.preventDefault();
            cameraRadius += e.deltaY * 0.002;
            cameraRadius = Math.max(1.5, Math.min(8, cameraRadius));
            updateCameraPosition();
        }, { passive: false });

        let worldFeatures = []; 

        // 3. 地図データ読み込み (安定したデータソースに変更)
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(response => {
                if (!response.ok) throw new Error('通信エラー');
                return response.json();
            })
            .then(data => {
                document.getElementById('loading-msg').style.display = 'none'; // 完了時に非表示
                worldFeatures = data.features; 

                const canvas = document.createElement('canvas'); 
                canvas.width = 2048; canvas.height = 1024;
                const ctx = canvas.getContext('2d'); 
                
                ctx.fillStyle = '#001122'; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                function lonToX(lon) { return ((lon + 180) / 360) * canvas.width; }
                function latToY(lat) { return (1 - (lat + 90) / 180) * canvas.height; }
                
                function drawPolygon(rings) {
                    ctx.beginPath();
                    rings.forEach(ring => { 
                        ring.forEach((coord, i) => { 
                            const x = lonToX(coord[0]); const y = latToY(coord[1]); 
                            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); 
                        }); 
                        ctx.closePath(); 
                    });
                    ctx.fill('evenodd'); ctx.stroke();
                }

                ctx.fillStyle = "rgba(34, 139, 34, 0.4)";
                ctx.strokeStyle = "rgba(50, 205, 50, 0.8)";
                ctx.lineWidth = 2;

                // 描画エラーで止まらないように安全対策を追加
                data.features.forEach(feature => {
                    if (!feature.geometry) return; // ジオメトリ(形)がないデータはスキップ
                    if (feature.geometry.type === 'Polygon') drawPolygon(feature.geometry.coordinates);
                    else if (feature.geometry.type === 'MultiPolygon') feature.geometry.coordinates.forEach(drawPolygon);
                });

                const texture = new THREE.CanvasTexture(canvas); 
                earthMaterial.color.setHex(0xffffff); 
                earthMaterial.map = texture; 
                earthMaterial.needsUpdate = true;
            })
            .catch(err => {
                console.error(err);
                document.getElementById('loading-msg').innerText = '地図の読み込みに失敗しました。再読み込みしてください。';
            });

        // 3b. 海洋・海域データの読み込み（陸地でない場所をクリックした際の名称表示用）
        let oceanFeatures = [];
        fetch('https://raw.githubusercontent.com/alvinometric/oceans-seas.geojson/main/oceans-seas.geo.json')
            .then(response => {
                if (!response.ok) throw new Error('通信エラー');
                return response.json();
            })
            .then(data => { oceanFeatures = data.features; if (lastSelection) renderGlobeInfo(); })
            .catch(err => console.error('海域データの読み込みに失敗:', err));

        // 3c. 首都データ・国名(日本語)の読み込み（ISO3(cca3)コード -> 首都名/日本語国名。GitHub raw = CORS許可済みで確認済み）
        let capitalData = {};
        let countryNameJa = {};
        let cca3ByName = {};   // 英語国名 -> 正しいcca3（国境データ側のISOコードが "-99" などで欠損している場合のフォールバック用）
        let countryCentroid = {}; // cca3 -> {lat, lon}（検索ズーム用の国の代表座標）
        fetch('https://raw.githubusercontent.com/mledoze/countries/master/dist/countries.json')
            .then(response => {
                if (!response.ok) throw new Error('通信エラー');
                return response.json();
            })
            .then(data => {
                data.forEach(c => {
                    if (c.cca3 && c.capital && c.capital.length > 0) {
                        capitalData[c.cca3] = c.capital[0];
                    }
                    if (c.cca3 && c.translations && c.translations.jpn && c.translations.jpn.common) {
                        countryNameJa[c.cca3] = c.translations.jpn.common;
                    }
                    if (c.name && c.name.common && c.cca3) {
                        cca3ByName[c.name.common] = c.cca3;
                    }
                    if (c.cca3 && Array.isArray(c.latlng) && c.latlng.length === 2) {
                        countryCentroid[c.cca3] = { lat: c.latlng[0], lon: c.latlng[1] };
                    }
                });
                if (lastSelection) renderGlobeInfo(); // 読み込み完了時に表示中の情報を更新
            })
            .catch(err => console.error('首都データの読み込みに失敗:', err));

        // 3d. 首都の緯度経度データの読み込み（ISO3コード -> 緯度経度。位置マーカー表示用）
        let capitalCoords = {};
        fetch('https://raw.githubusercontent.com/Stefie/geojson-world/master/capitals.geojson')
            .then(response => {
                if (!response.ok) throw new Error('通信エラー');
                return response.json();
            })
            .then(data => {
                data.features.forEach(f => {
                    const iso3 = f.properties && f.properties.iso3;
                    const coord = f.geometry && f.geometry.coordinates; // [lon, lat]
                    if (iso3 && coord && coord.length === 2) {
                        capitalCoords[iso3] = { lat: coord[1], lng: coord[0] };
                    }
                });
                if (lastSelection) renderGlobeInfo(); // 読み込み完了時に表示中の情報を更新
            })
            .catch(err => console.error('首都座標データの読み込みに失敗:', err));

        // 海洋・海域名の日本語対応表（主要なものをカバー。無い場合は英語名のまま表示）
        const oceanNameJa = {
            'North Pacific Ocean': '北太平洋', 'South Pacific Ocean': '南太平洋',
            'North Atlantic Ocean': '北大西洋', 'South Atlantic Ocean': '南大西洋',
            'Indian Ocean': 'インド洋', 'Arctic Ocean': '北極海', 'Southern Ocean': '南極海',
            'Mediterranean Sea': '地中海', 'Mediterranean Region': '地中海',
            'Sea of Japan': '日本海', 'Japan Sea': '日本海', 'Japan Sea/East Sea': '日本海',
            'South China Sea': '南シナ海', 'East China Sea': '東シナ海',
            'Yellow Sea': '黄海', 'Philippine Sea': 'フィリピン海', 'Caribbean Sea': 'カリブ海',
            'Gulf of Mexico': 'メキシコ湾', 'Bay of Bengal': 'ベンガル湾', 'Arabian Sea': 'アラビア海',
            'Red Sea': '紅海', 'Black Sea': '黒海', 'Caspian Sea': 'カスピ海', 'Baltic Sea': 'バルト海',
            'North Sea': '北海', 'Norwegian Sea': 'ノルウェー海', 'Greenland Sea': 'グリーンランド海',
            'Barentsz Sea': 'バレンツ海', 'Barents Sea': 'バレンツ海', 'Kara Sea': 'カラ海',
            'Laptev Sea': 'ラプテフ海', 'East Siberian Sea': '東シベリア海', 'Chukchi Sea': 'チュクチ海',
            'Beaufort Sea': 'ボーフォート海', 'Bering Sea': 'ベーリング海', 'Sea of Okhotsk': 'オホーツク海',
            'Coral Sea': '珊瑚海', 'Tasman Sea': 'タスマン海', 'Arafura Sea': 'アラフラ海',
            'Timor Sea': 'ティモール海', 'Java Sea': 'ジャワ海', 'Bali Sea': 'バリ海',
            'Banda Sea': 'バンダ海', 'Celebes Sea': 'セレベス海', 'Sulu Sea': 'スールー海',
            'Andaman or Burma Sea': 'アンダマン海', 'Andaman Sea': 'アンダマン海',
            'Persian Gulf': 'ペルシャ湾', 'Gulf of Oman': 'オマーン湾', 'Gulf of Aden': 'アデン湾',
            'Adriatic Sea': 'アドリア海', 'Aegean Sea': 'エーゲ海', 'Ionian Sea': 'イオニア海',
            'Tyrrhenian Sea': 'ティレニア海', 'Ligurian Sea': 'リグリア海', 'Alboran Sea': 'アルボラン海',
            'Balearic Sea': 'バレアレス海', 'Balearic (Iberian Sea)': 'バレアレス海',
            'English Channel': 'イギリス海峡', 'Bristol Channel': 'ブリストル海峡',
            'Irish Sea and St. George\'s Channel': 'アイリッシュ海', 'Irish Sea': 'アイリッシュ海',
            'Celtic Sea': 'ケルト海', 'Bay of Biscay': 'ビスケー湾', 'Labrador Sea': 'ラブラドル海',
            'Hudson Bay': 'ハドソン湾', 'Gulf of St. Lawrence': 'セントローレンス湾',
            'Sargasso Sea': 'サルガッソー海', 'Davis Strait': 'デービス海峡', 'Baffin Bay': 'バフィン湾',
            'Gulf of Alaska': 'アラスカ湾', 'Gulf of California': 'カリフォルニア湾',
            'Great Australian Bight': 'グレートオーストラリア湾', 'Ross Sea': 'ロス海',
            'Weddell Sea': 'ウェッデル海', 'Amundsen Sea': 'アムンゼン海',
            'Bellingshausen Sea': 'ベリングスハウゼン海', 'Scotia Sea': 'スコシア海',
            'Mozambique Channel': 'モザンビーク海峡', 'Gulf of Guinea': 'ギニア湾',
            'Great Barrier Reef': 'グレートバリアリーフ'
        };

        // 首都名の日本語対応表（cca3コード -> 日本語首都名。無い国は英語表記のまま表示）
        const capitalNameJa = {
            JPN: '東京', CHN: '北京', KOR: 'ソウル', PRK: '平壌', USA: 'ワシントンD.C.', CAN: 'オタワ',
            MEX: 'メキシコシティ', GBR: 'ロンドン', FRA: 'パリ', DEU: 'ベルリン', ITA: 'ローマ',
            ESP: 'マドリード', PRT: 'リスボン', NLD: 'アムステルダム', BEL: 'ブリュッセル', CHE: 'ベルン',
            AUT: 'ウィーン', SWE: 'ストックホルム', NOR: 'オスロ', DNK: 'コペンハーゲン', FIN: 'ヘルシンキ',
            ISL: 'レイキャビク', IRL: 'ダブリン', POL: 'ワルシャワ', CZE: 'プラハ', SVK: 'ブラチスラバ',
            HUN: 'ブダペスト', ROU: 'ブカレスト', BGR: 'ソフィア', GRC: 'アテネ', TUR: 'アンカラ',
            RUS: 'モスクワ', UKR: 'キーウ', BLR: 'ミンスク', LTU: 'ビリニュス', LVA: 'リガ', EST: 'タリン',
            HRV: 'ザグレブ', SRB: 'ベオグラード', SVN: 'リュブリャナ', BIH: 'サラエボ', MKD: 'スコピエ',
            ALB: 'ティラナ', MNE: 'ポドゴリツァ', MDA: 'キシナウ', LUX: 'ルクセンブルク', MLT: 'バレッタ',
            CYP: 'ニコシア', AUS: 'キャンベラ', NZL: 'ウェリントン', IND: 'ニューデリー', PAK: 'イスラマバード',
            BGD: 'ダッカ', LKA: 'スリジャヤワルダナプラコッテ', NPL: 'カトマンズ', BTN: 'ティンプー',
            MMR: 'ネピドー', THA: 'バンコク', VNM: 'ハノイ', KHM: 'プノンペン', LAO: 'ビエンチャン',
            MYS: 'クアラルンプール', SGP: 'シンガポール', IDN: 'ジャカルタ', PHL: 'マニラ',
            BRN: 'バンダルスリブガワン', TLS: 'ディリ', MNG: 'ウランバートル', KAZ: 'アスタナ',
            UZB: 'タシケント', TKM: 'アシガバート', TJK: 'ドゥシャンベ', KGZ: 'ビシュケク', AFG: 'カブール',
            IRN: 'テヘラン', IRQ: 'バグダッド', SAU: 'リヤド', YEM: 'サヌア', OMN: 'マスカット',
            ARE: 'アブダビ', QAT: 'ドーハ', BHR: 'マナーマ', KWT: 'クウェート', JOR: 'アンマン',
            ISR: 'エルサレム', PSE: 'ラマッラ', LBN: 'ベイルート', SYR: 'ダマスカス', EGY: 'カイロ',
            LBY: 'トリポリ', TUN: 'チュニス', DZA: 'アルジェ', MAR: 'ラバト', SDN: 'ハルツーム',
            SSD: 'ジュバ', ETH: 'アディスアベバ', ERI: 'アスマラ', DJI: 'ジブチ', SOM: 'モガディシュ',
            KEN: 'ナイロビ', UGA: 'カンパラ', TZA: 'ドドマ', RWA: 'キガリ', BDI: 'ギテガ', ZMB: 'ルサカ',
            ZWE: 'ハラレ', MOZ: 'マプト', MWI: 'リロングウェ', AGO: 'ルアンダ', NAM: 'ウィントフック',
            BWA: 'ハボローネ', ZAF: 'プレトリア', LSO: 'マセル', SWZ: 'ムババーネ', MDG: 'アンタナナリボ',
            NGA: 'アブジャ', GHA: 'アクラ', CIV: 'ヤムスクロ', SEN: 'ダカール', MLI: 'バマコ',
            BFA: 'ワガドゥグ', NER: 'ニアメ', TCD: 'ンジャメナ', CMR: 'ヤウンデ', GAB: 'リーブルビル',
            COG: 'ブラザビル', COD: 'キンシャサ', CAF: 'バンギ', GNQ: 'マラボ', BRA: 'ブラジリア',
            ARG: 'ブエノスアイレス', CHL: 'サンティアゴ', PER: 'リマ', COL: 'ボゴタ', VEN: 'カラカス',
            ECU: 'キト', BOL: 'スクレ', PRY: 'アスンシオン', URY: 'モンテビデオ', GUY: 'ジョージタウン',
            SUR: 'パラマリボ', CUB: 'ハバナ', JAM: 'キングストン', HTI: 'ポルトープランス',
            DOM: 'サントドミンゴ', PAN: 'パナマシティ', CRI: 'サンホセ', NIC: 'マナグア',
            HND: 'テグシガルパ', SLV: 'サンサルバドル', GTM: 'グアテマラシティ', BLZ: 'ベルモパン'
        };

        // 4. 緯度線・経度線の描画
        const gridMaterial = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.3 });
        
        for (let lat = -80; lat <= 80; lat += 10) {
            if (lat === 0) continue; 
            const rad = lat * Math.PI / 180;
            const y = radius * Math.sin(rad);
            const r = radius * Math.cos(rad);
            const points = [];
            for (let i = 0; i <= 64; i++) {
                const theta = (i / 64) * 2 * Math.PI;
                points.push(new THREE.Vector3(r * Math.cos(theta), y, r * Math.sin(theta)));
            }
            earthGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), gridMaterial));
        }
        
        for (let lon = 0; lon < 180; lon += 10) {
            const rad = lon * Math.PI / 180;
            const points = [];
            for (let i = 0; i <= 64; i++) {
                const theta = (i / 64) * 2 * Math.PI;
                points.push(new THREE.Vector3(radius * Math.cos(theta) * Math.cos(rad), radius * Math.sin(theta), radius * Math.cos(theta) * Math.sin(rad)));
            }
            earthGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), gridMaterial));
        }

        // 赤道
        const equatorPoints = [];
        for (let i = 0; i <= 64; i++) {
            const theta = (i / 64) * 2 * Math.PI;
            equatorPoints.push(new THREE.Vector3(radius * Math.cos(theta), 0, radius * Math.sin(theta)));
        }
        earthGroup.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(equatorPoints), 
            new THREE.LineBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.9, linewidth: 2 })
        ));

        // 5. モード管理とクリック判定ロジック
        let currentMode = 'simple'; 
        let selectedPoints = []; 
        let markers = [];        
        let measureLine = null;  
        let globeMarker = null; 
        let capitalMarker = null;
        let displayLang = 'ja'; // 'ja' または 'en'
        let lastSelection = null; // { type: 'country'|'ocean', feature }

        document.querySelectorAll('input[name="mode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                currentMode = e.target.value;
                document.getElementById('measure-container').classList.remove('active');
                document.getElementById('globe-container').classList.remove('active');
                
                if (currentMode === 'globe') {
                    document.getElementById('globe-container').classList.add('active');
                } else {
                    document.getElementById('measure-container').classList.add('active');
                    document.getElementById('measure-hint').innerText = currentMode === 'precise' ? '地球上の緯度経度交点をクリック (1°単位)' : '地球上の緯度経度交点をクリック (10°単位)';
                }
                resetMeasurement();
            });
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function vectorToLatLon(v) {
            const lat = Math.asin(v.y / radius) * (180 / Math.PI);
            const lon = Math.atan2(-v.z, v.x) * (180 / Math.PI);
            return { lat, lon };
        }

        function latLonToVector(lat, lon) {
            const phi = lat * (Math.PI / 180);
            const theta = lon * (Math.PI / 180);
            return new THREE.Vector3(
                radius * Math.cos(phi) * Math.cos(theta),
                radius * Math.sin(phi),
                -radius * Math.cos(phi) * Math.sin(theta)
            );
        }

        function calcHaversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return (R * c).toFixed(1);
        }

        function formatLatLon(lat, lon) {
            const latStr = lat >= 0 ? ('北緯' + lat + '度') : ('南緯' + (-lat) + '度');
            const lonStr = lon >= 0 ? ('東経' + lon + '度') : ('西経' + (-lon) + '度');
            return latStr + ', ' + lonStr;
        }

        function checkPointInRings(pt, rings) {
            let inside = false;
            for (let ring of rings) {
                for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                    let xi = ring[i][0], yi = ring[i][1];
                    let xj = ring[j][0], yj = ring[j][1];
                    let intersect = ((yi > pt[1]) !== (yj > pt[1])) && (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi);
                    if (intersect) inside = !inside;
                }
            }
            return inside;
        }

        function getCountryByLatLon(lat, lon) {
            for (let feature of worldFeatures) {
                if (!feature.geometry) continue;
                if (feature.geometry.type === 'Polygon') {
                    if (checkPointInRings([lon, lat], feature.geometry.coordinates)) return feature;
                } else if (feature.geometry.type === 'MultiPolygon') {
                    for (let poly of feature.geometry.coordinates) {
                        if (checkPointInRings([lon, lat], poly)) return feature;
                    }
                }
            }
            return null;
        }

        function getOceanByLatLon(lat, lon) {
            for (let feature of oceanFeatures) {
                if (!feature.geometry) continue;
                if (feature.geometry.type === 'Polygon') {
                    if (checkPointInRings([lon, lat], feature.geometry.coordinates)) return feature;
                } else if (feature.geometry.type === 'MultiPolygon') {
                    for (let poly of feature.geometry.coordinates) {
                        if (checkPointInRings([lon, lat], poly)) return feature;
                    }
                }
            }
            return null;
        }

        function renderGlobeInfo() {
            if (!lastSelection) return;

            if (capitalMarker) { earthGroup.remove(capitalMarker); capitalMarker = null; }

            if (lastSelection.type === 'country' && lastSelection.feature) {
                const countryFeature = lastSelection.feature;
                const nameEn = countryFeature.properties.NAME;
                const rawIso3 = countryFeature.properties.ISO_A3_EH;
                // 国境データ側のISOコードが "-99"（未割当）などの場合は、英語国名で正しいコードを引き直す
                const isoCode3 = (rawIso3 && rawIso3 !== '-99') ? rawIso3 : (cca3ByName[nameEn] || null);
                const nameJa = isoCode3 && countryNameJa[isoCode3];
                const countryName = displayLang === 'ja' ? (nameJa || nameEn) : nameEn;

                document.getElementById('country-label').innerText = displayLang === 'ja' ? '国名' : 'Country';
                document.getElementById('country-name').innerText = countryName || (displayLang === 'ja' ? '不明' : 'Unknown');
                document.getElementById('capital-label').innerText = displayLang === 'ja' ? '首都' : 'Capital';
                document.getElementById('capital-row').style.display = '';

                const capitalEn = isoCode3 && capitalData[isoCode3];
                const capitalJa = isoCode3 && capitalNameJa[isoCode3];
                let capitalText;
                if (capitalEn) {
                    capitalText = displayLang === 'ja' ? (capitalJa || capitalEn) : capitalEn;
                } else {
                    capitalText = displayLang === 'ja' ? 'データなし' : 'No data';
                }
                document.getElementById('capital-name').innerText = capitalText;

                // 首都の位置を明示するマーカー
                const coords = isoCode3 && capitalCoords[isoCode3];
                if (coords) {
                    const capMat = new THREE.MeshBasicMaterial({ color: 0xff3333 });
                    capitalMarker = new THREE.Mesh(new THREE.SphereGeometry(0.02, 16, 16), capMat);
                    capitalMarker.position.copy(latLonToVector(coords.lat, coords.lng));
                    earthGroup.add(capitalMarker);
                }
            } else {
                const oceanFeature = lastSelection.feature;
                const nameEn = oceanFeature && oceanFeature.properties.NAME;
                const nameJa = nameEn && oceanNameJa[nameEn];
                document.getElementById('country-label').innerText = displayLang === 'ja' ? '海域名' : 'Sea / Ocean';
                document.getElementById('country-name').innerText = nameEn ? (displayLang === 'ja' ? (nameJa || nameEn) : nameEn) : (displayLang === 'ja' ? '不明' : 'Unknown');
                document.getElementById('capital-row').style.display = 'none';
            }
        }

        // 球面上のポリゴン頂点から代表座標（重心方向）を計算する（日付変更線をまたぐ海域でも安定）
        function polygonCentroidLatLon(feature) {
            let sumX = 0, sumY = 0, sumZ = 0, count = 0;
            function processRing(ring) {
                ring.forEach(coord => {
                    const lonRad = coord[0] * Math.PI / 180, latRad = coord[1] * Math.PI / 180;
                    sumX += Math.cos(latRad) * Math.cos(lonRad);
                    sumY += Math.cos(latRad) * Math.sin(lonRad);
                    sumZ += Math.sin(latRad);
                    count++;
                });
            }
            if (!feature.geometry) return null;
            if (feature.geometry.type === 'Polygon') {
                feature.geometry.coordinates.forEach(processRing);
            } else if (feature.geometry.type === 'MultiPolygon') {
                feature.geometry.coordinates.forEach(poly => poly.forEach(processRing));
            }
            if (count === 0) return null;
            sumX /= count; sumY /= count; sumZ /= count;
            const lon = Math.atan2(sumY, sumX) * 180 / Math.PI;
            const hyp = Math.sqrt(sumX * sumX + sumY * sumY);
            const lat = Math.atan2(sumZ, hyp) * 180 / Math.PI;
            return { lat, lon };
        }

        // 指定した緯度経度が正面に来るようカメラを移動し、目印のマーカーを置く
        function zoomToLatLon(lat, lon, radius) {
            const latRad = lat * Math.PI / 180;
            const lonRad = lon * Math.PI / 180;
            cameraPhi = Math.max(0.1, Math.min(Math.PI - 0.1, Math.PI / 2 - latRad));
            cameraTheta = Math.atan2(Math.cos(lonRad), -Math.sin(lonRad));
            cameraRadius = Math.max(1.5, Math.min(8, radius || 2.2));
            updateCameraPosition();

            if (globeMarker) { earthGroup.remove(globeMarker); globeMarker = null; }
            const markerMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            globeMarker = new THREE.Mesh(new THREE.SphereGeometry(0.015, 16, 16), markerMat);
            globeMarker.position.copy(latLonToVector(lat, lon));
            earthGroup.add(globeMarker);
        }

        // worldFeatures（国境データ）を、正しいISO3コード・日本語名つきで検索しやすい形にまとめる
        function buildCountryIndex() {
            return worldFeatures.map(feature => {
                const nameEn = feature.properties.NAME;
                const rawIso3 = feature.properties.ISO_A3_EH;
                const iso3 = (rawIso3 && rawIso3 !== '-99') ? rawIso3 : (nameEn && cca3ByName[nameEn]) || null;
                const nameJa = iso3 && countryNameJa[iso3];
                return { feature, iso3, nameEn, nameJa };
            });
        }

        function searchLocation() {
            const statusEl = document.getElementById('search-status');
            const query = document.getElementById('search-input').value.trim();
            statusEl.innerText = '';
            if (!query) return;
            const qLower = query.toLowerCase();

            // 検索は地球儀モードの機能なので、他モードにいる場合は自動的に切り替える
            const globeRadio = document.querySelector('input[name="mode"][value="globe"]');
            if (!globeRadio.checked) {
                globeRadio.checked = true;
                globeRadio.dispatchEvent(new Event('change'));
            }

            const index = buildCountryIndex();

            function findCountry(exact) {
                return index.find(e => {
                    if (!e.nameEn) return false;
                    const enHit = exact ? (e.nameEn.toLowerCase() === qLower) : e.nameEn.toLowerCase().includes(qLower);
                    const jaHit = e.nameJa && (exact ? e.nameJa === query : e.nameJa.includes(query));
                    return enHit || jaHit;
                });
            }
            function findCapital(exact) {
                return index.find(e => {
                    if (!e.iso3) return false;
                    const capEn = capitalData[e.iso3];
                    const capJa = capitalNameJa[e.iso3];
                    const enHit = capEn && (exact ? capEn.toLowerCase() === qLower : capEn.toLowerCase().includes(qLower));
                    const jaHit = capJa && (exact ? capJa === query : capJa.includes(query));
                    return enHit || jaHit;
                });
            }
            function findOcean(exact) {
                return oceanFeatures.find(f => {
                    const nameEn = f.properties && f.properties.NAME;
                    if (!nameEn) return false;
                    const nameJa = oceanNameJa[nameEn];
                    const enHit = exact ? nameEn.toLowerCase() === qLower : nameEn.toLowerCase().includes(qLower);
                    const jaHit = nameJa && (exact ? nameJa === query : nameJa.includes(query));
                    return enHit || jaHit;
                });
            }

            // 完全一致を優先し、無ければ部分一致で探す（例:「フランス」が「フランス領○○」に誤って一致するのを防ぐ）
            const countryMatch = findCountry(true) || findCountry(false);
            const capitalMatch = findCapital(true) || findCapital(false);
            const oceanMatch = findOcean(true) || findOcean(false);

            if (countryMatch) {
                lastSelection = { type: 'country', feature: countryMatch.feature };
                renderGlobeInfo();
                const centroid = (countryMatch.iso3 && countryCentroid[countryMatch.iso3]) || polygonCentroidLatLon(countryMatch.feature);
                if (centroid) zoomToLatLon(centroid.lat, centroid.lon);
                return;
            }

            if (capitalMatch) {
                lastSelection = { type: 'country', feature: capitalMatch.feature };
                renderGlobeInfo();
                const coords = capitalCoords[capitalMatch.iso3];
                if (coords) {
                    zoomToLatLon(coords.lat, coords.lng);
                } else {
                    const centroid = countryCentroid[capitalMatch.iso3] || polygonCentroidLatLon(capitalMatch.feature);
                    if (centroid) zoomToLatLon(centroid.lat, centroid.lon);
                }
                return;
            }

            if (oceanMatch) {
                lastSelection = { type: 'ocean', feature: oceanMatch };
                renderGlobeInfo();
                const centroid = polygonCentroidLatLon(oceanMatch);
                if (centroid) zoomToLatLon(centroid.lat, centroid.lon);
                return;
            }

            statusEl.innerText = displayLang === 'ja' ? '見つかりませんでした' : 'Not found';
        }

        document.getElementById('search-btn').addEventListener('click', searchLocation);
        document.getElementById('search-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') searchLocation();
        });

        document.getElementById('lang-toggle-btn').addEventListener('click', () => {
            displayLang = displayLang === 'ja' ? 'en' : 'ja';
            document.getElementById('lang-toggle-btn').innerText = displayLang === 'ja'
                ? '表示言語: 日本語 (押すとEnglish)'
                : 'Display language: English (click for 日本語)';
            if (lastSelection) {
                renderGlobeInfo();
            } else {
                document.getElementById('country-label').innerText = displayLang === 'ja' ? '国名' : 'Country';
                document.getElementById('capital-label').innerText = displayLang === 'ja' ? '首都' : 'Capital';
            }
        });

        window.resetMeasurement = function() {
            selectedPoints = [];
            markers.forEach(m => earthGroup.remove(m));
            markers = [];
            if (measureLine) { earthGroup.remove(measureLine); measureLine = null; }
            if (globeMarker) { earthGroup.remove(globeMarker); globeMarker = null; }
            if (capitalMarker) { earthGroup.remove(capitalMarker); capitalMarker = null; }
            lastSelection = null;
            
            document.getElementById('point1-info').innerHTML = '地点1: <span class="val">未選択</span>';
            document.getElementById('point2-info').innerHTML = '地点2: <span class="val">未選択</span>';
            document.getElementById('distance-result').innerText = '距離: --- km';
            
            document.getElementById('country-label').innerText = displayLang === 'ja' ? '国名' : 'Country';
            document.getElementById('country-name').innerText = '---';
            document.getElementById('capital-label').innerText = displayLang === 'ja' ? '首都' : 'Capital';
            document.getElementById('capital-row').style.display = '';
            document.getElementById('capital-name').innerText = '---';
        };

        window.addEventListener('click', (event) => {
            if (event.target.closest('#ui-panel')) return;
            if (dragged) return; // ドラッグ操作（視点回転）の場合はクリック判定をスキップ

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(earthMesh);

            if (intersects.length > 0) {
                const point = intersects[0].point;
                const rawLatLon = vectorToLatLon(point);

                if (currentMode === 'globe') {
                    if (globeMarker) earthGroup.remove(globeMarker); 
                    
                    const markerMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                    globeMarker = new THREE.Mesh(new THREE.SphereGeometry(0.015, 16, 16), markerMat);
                    globeMarker.position.copy(point);
                    earthGroup.add(globeMarker);

                    document.getElementById('country-name').innerText = displayLang === 'ja' ? '検索中...' : 'Searching...';
                    document.getElementById('capital-name').innerText = displayLang === 'ja' ? '検索中...' : 'Searching...';

                    const countryFeature = getCountryByLatLon(rawLatLon.lat, rawLatLon.lon);
                    
                    if (countryFeature) {
                        lastSelection = { type: 'country', feature: countryFeature };
                    } else {
                        const oceanFeature = getOceanByLatLon(rawLatLon.lat, rawLatLon.lon);
                        lastSelection = { type: 'ocean', feature: oceanFeature };
                    }
                    renderGlobeInfo();

                } else {
                    if (selectedPoints.length >= 2) window.resetMeasurement();

                    const snapStep = currentMode === 'precise' ? 1 : 10;
                    const snappedLat = Math.round(rawLatLon.lat / snapStep) * snapStep;
                    const snappedLon = Math.round(rawLatLon.lon / snapStep) * snapStep;

                    selectedPoints.push({ lat: snappedLat, lon: snappedLon });
                    
                    const markerPos = latLonToVector(snappedLat, snappedLon);
                    const markerGeo = new THREE.SphereGeometry(0.02, 16, 16);
                    const markerMat = new THREE.MeshBasicMaterial({
                        color: currentMode === 'precise' ? 0x00ff00 : 0xff00ff,
                        transparent: true,
                        opacity: 0.55
                    });
                    const marker = new THREE.Mesh(markerGeo, markerMat);
                    marker.position.copy(markerPos);
                    earthGroup.add(marker);
                    markers.push(marker);

                    if (selectedPoints.length === 1) {
                        document.getElementById('point1-info').innerHTML = '地点1: <span class="val">' + formatLatLon(snappedLat, snappedLon) + '</span>';
                    } else if (selectedPoints.length === 2) {
                        document.getElementById('point2-info').innerHTML = '地点2: <span class="val">' + formatLatLon(snappedLat, snappedLon) + '</span>';
                        
                        const dist = calcHaversineDistance(selectedPoints[0].lat, selectedPoints[0].lon, selectedPoints[1].lat, selectedPoints[1].lon);
                        document.getElementById('distance-result').innerText = '距離: 約 ' + Number(dist).toLocaleString() + ' km';

                        const linePoints = [];
                        for (let i = 0; i <= 50; i++) {
                            const t = i / 50;
                            const v1 = latLonToVector(selectedPoints[0].lat, selectedPoints[0].lon).normalize();
                            const v2 = latLonToVector(selectedPoints[1].lat, selectedPoints[1].lon).normalize();
                            const v3 = v1.clone().lerp(v2, t).normalize().multiplyScalar(radius + 0.005);
                            linePoints.push(v3);
                        }
                        measureLine = new THREE.Line(
                            new THREE.BufferGeometry().setFromPoints(linePoints),
                            new THREE.LineBasicMaterial({ color: currentMode === 'precise' ? 0x00ff00 : 0xff00ff, linewidth: 3 })
                        );
                        earthGroup.add(measureLine);
                    }
                }
            }
        });

        // 6. アニメーション
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
