<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>オフライン地球儀 iPad版</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111f;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#fff}
#wrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none;background:radial-gradient(circle at center,#0c2340,#020812 70%)}
#panel{
 position:absolute;left:12px;top:12px;z-index:3;
 background:rgba(0,15,30,.82);border:1px solid #3dd7ff;border-radius:12px;
 padding:12px 14px;max-width:min(320px,82vw);box-sizing:border-box;
 box-shadow:0 6px 22px rgba(0,0,0,.35)
}
#panel h1{font-size:17px;margin:0 0 8px}
#panel p{font-size:12px;line-height:1.45;margin:5px 0;color:#c7eaf5}
#coords{font-size:14px;margin-top:8px;color:#7ff0ff;font-weight:700}
.badge{display:inline-block;font-size:11px;padding:3px 7px;border-radius:999px;background:#0d4e64;color:#bdf6ff;margin-bottom:7px}
button{margin-top:8px;background:#164f67;color:#fff;border:1px solid #57dfff;border-radius:8px;padding:7px 10px;font-size:13px}
#msg{position:absolute;right:10px;bottom:10px;font-size:11px;color:#9bc7d4;background:rgba(0,0,0,.4);padding:6px 8px;border-radius:7px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="panel">
  <div class="badge">完全オフライン・1ファイル</div>
  <h1>iPad用 簡易地球儀</h1>
  <p>指でドラッグして回転。2本指で拡大・縮小。地球上をタップすると緯度・経度を表示します。</p>
  <div id="coords">緯度: -- / 経度: --</div>
  <button id="reset">向きをリセット</button>
</div>
<div id="msg">通信・外部ライブラリ不使用</div>
</div>

<script>
(function(){
"use strict";

var canvas=document.getElementById("c");
var ctx=canvas.getContext("2d");
var coords=document.getElementById("coords");
var reset=document.getElementById("reset");

var dpr=Math.min(window.devicePixelRatio||1,2);
var W=0,H=0,cx=0,cy=0,R=180;
var rotLon=-135*Math.PI/180;
var rotLat=25*Math.PI/180;
var zoom=1;

var dragging=false,lastX=0,lastY=0,moved=false;
var pinchStart=0,zoomStart=1;

function resize(){
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.max(1,Math.floor(W*dpr));
  canvas.height=Math.max(1,Math.floor(H*dpr));
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2; cy=H/2;
  R=Math.min(W,H)*0.34*zoom;
  draw();
}
window.addEventListener("resize",resize);

function sph(lat,lon){
  var cl=Math.cos(lat);
  var x=cl*Math.sin(lon), y=Math.sin(lat), z=cl*Math.cos(lon);

  var c1=Math.cos(rotLon), s1=Math.sin(rotLon);
  var x1=x*c1+z*s1, z1=-x*s1+z*c1;

  var c2=Math.cos(rotLat), s2=Math.sin(rotLat);
  var y2=y*c2-z1*s2, z2=y*s2+z1*c2;

  return {x:x1,y:y2,z:z2};
}
function project(lat,lon){
  var p=sph(lat,lon);
  return {x:cx+R*p.x,y:cy-R*p.y,z:p.z};
}
function linePath(points,close){
  var started=false;
  ctx.beginPath();
  for(var i=0;i<points.length;i++){
    var p=project(points[i][0]*Math.PI/180,points[i][1]*Math.PI/180);
    if(p.z<=0){started=false;continue;}
    if(!started){ctx.moveTo(p.x,p.y);started=true;}
    else ctx.lineTo(p.x,p.y);
  }
  if(close && started) ctx.closePath();
}
function ellipseLand(lat0,lon0,ry,rx,n){
  var pts=[];
  for(var i=0;i<=n;i++){
    var a=i/n*Math.PI*2;
    var lat=lat0+Math.sin(a)*ry;
    var lon=lon0+Math.cos(a)*rx/Math.max(.25,Math.cos(lat0*Math.PI/180));
    pts.push([lat,lon]);
  }
  linePath(pts,true);
  ctx.fill();
  ctx.stroke();
}
function drawGrid(){
  ctx.strokeStyle="rgba(100,220,255,.23)";
  ctx.lineWidth=1;
  for(var lat=-60;lat<=60;lat+=30){
    var pts=[]; for(var lon=-180;lon<=180;lon+=3) pts.push([lat,lon]);
    linePath(pts,false); ctx.stroke();
  }
  for(var lon=-150;lon<=180;lon+=30){
    var pts2=[]; for(var lat2=-89;lat2<=89;lat2+=3) pts2.push([lat2,lon]);
    linePath(pts2,false); ctx.stroke();
  }
}
function drawLands(){
  ctx.fillStyle="#2aaf67";
  ctx.strokeStyle="#9be9a8";
  ctx.lineWidth=1.2;
  // 大陸を単純化した楕円群。通信も外部地図データも使わない。
  ellipseLand(47,-105,25,35,80); // 北米
  ellipseLand(15,-85,10,14,50);  // 中米
  ellipseLand(-16,-60,30,18,80); // 南米
  ellipseLand(52,20,16,25,70);   // 欧州
  ellipseLand(7,20,33,24,90);    // アフリカ
  ellipseLand(45,75,27,55,110);  // アジア
  ellipseLand(-25,135,13,18,60); // 豪州
  ellipseLand(72,-40,10,16,50);  // グリーンランド
  ellipseLand(36,138,7,4,40);    // 日本
  ellipseLand(-78,0,8,75,100);   // 南極
}
function draw(){
  ctx.clearRect(0,0,W,H);

  var g=ctx.createRadialGradient(cx-R*.35,cy-R*.4,R*.1,cx,cy,R);
  g.addColorStop(0,"#36b5ff");
  g.addColorStop(.72,"#0b5ca7");
  g.addColorStop(1,"#06315d");
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.fillStyle=g;ctx.fill();

  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();

  drawGrid();
  drawLands();

  ctx.restore();

  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle="rgba(170,240,255,.95)";ctx.lineWidth=2;ctx.stroke();

  // 簡単な陰影
  var sh=ctx.createRadialGradient(cx-R*.4,cy-R*.45,R*.15,cx,cy,R*1.1);
  sh.addColorStop(.45,"rgba(255,255,255,0)");
  sh.addColorStop(1,"rgba(0,0,0,.38)");
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=sh;ctx.fill();
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function pointerDown(x,y){
  dragging=true; moved=false; lastX=x; lastY=y;
}
function pointerMove(x,y){
  if(!dragging)return;
  var dx=x-lastX,dy=y-lastY;
  if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
  rotLon+=dx*0.008;
  rotLat=clamp(rotLat+dy*0.008,-1.45,1.45);
  lastX=x;lastY=y;draw();
}
function pointerUp(x,y){
  if(dragging && !moved) pick(x,y);
  dragging=false;
}
function pick(x,y){
  var nx=(x-cx)/R, ny=-(y-cy)/R;
  var rr=nx*nx+ny*ny;
  if(rr>1){coords.textContent="地球の上をタップしてください";return;}
  var nz=Math.sqrt(1-rr);

  // 逆回転
  var c2=Math.cos(-rotLat),s2=Math.sin(-rotLat);
  var y1=ny*c2-nz*s2, z1=ny*s2+nz*c2;
  var c1=Math.cos(-rotLon),s1=Math.sin(-rotLon);
  var xx=nx*c1+z1*s1, zz=-nx*s1+z1*c1;

  var lat=Math.asin(clamp(y1,-1,1))*180/Math.PI;
  var lon=Math.atan2(xx,zz)*180/Math.PI;
  coords.textContent="緯度: "+lat.toFixed(1)+"° / 経度: "+lon.toFixed(1)+"°";
}

canvas.addEventListener("pointerdown",function(e){
  canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
  pointerDown(e.clientX,e.clientY);
});
canvas.addEventListener("pointermove",function(e){pointerMove(e.clientX,e.clientY);});
canvas.addEventListener("pointerup",function(e){pointerUp(e.clientX,e.clientY);});
canvas.addEventListener("pointercancel",function(){dragging=false;});

canvas.addEventListener("touchstart",function(e){
  if(e.touches.length===2){
    var dx=e.touches[0].clientX-e.touches[1].clientX;
    var dy=e.touches[0].clientY-e.touches[1].clientY;
    pinchStart=Math.hypot(dx,dy); zoomStart=zoom;
  }
},{passive:false});
canvas.addEventListener("touchmove",function(e){
  if(e.touches.length===2 && pinchStart>0){
    e.preventDefault();
    var dx=e.touches[0].clientX-e.touches[1].clientX;
    var dy=e.touches[0].clientY-e.touches[1].clientY;
    var d=Math.hypot(dx,dy);
    zoom=clamp(zoomStart*d/pinchStart,.65,1.45);
    R=Math.min(W,H)*0.34*zoom; draw();
  }
},{passive:false});

reset.addEventListener("click",function(){
  rotLon=-135*Math.PI/180;rotLat=25*Math.PI/180;zoom=1;
  R=Math.min(W,H)*0.34;coords.textContent="緯度: -- / 経度: --";draw();
});

resize();
})();
</script>
</body>
</html>
